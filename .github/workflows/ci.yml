name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21", "1.22"]
        exclude:
          - os: macos-latest
            go: "1.21"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: go vet ./...

      - name: 模型适配层协议族测试（无需任何 API key，不联网）
        env:
          # macOS 上 cgo 链接出的测试二进制缺少 LC_UUID，dyld 会直接 abort trap。
          # 本项目不需要 cgo，统一走静态构建（与 go build 一致）。
          CGO_ENABLED: "0"
        run: go test ./internal/llm/ -v -count=1

      - name: gofmt 检查（提示性；gofmt 输出随工具链版本变化，不作为阻塞条件）
        if: runner.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未经 gofmt 格式化："
            echo "$unformatted"
            gofmt -d ./cmd ./internal || true
          fi

      - name: 构建（静态二进制，与 make release 保持一致）
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o workagent ./cmd/workagent

      - name: 列出模型服务商（不联网）
        run: ./workagent models

      - name: 列出场景
        run: ./workagent cases .

      - name: 包结构校验（含逐场景文件齐备性）
        run: ./workagent check .

      - name: 计算闭包摘要
        run: ./workagent attest .

      - name: 生成适配层
        run: ./workagent adapt .

      - name: 运行全部场景（L3 纯确定性；带模型的场景重放已录制响应，无需联网与密钥）
        run: ./workagent run --all . --replay

      - name: 全场景复现校验（必须全部 PASS）
        run: ./workagent verify --all .

      - name: 边界拒绝测试（越界输入必须失败）
        shell: bash
        run: |
          echo '{"project":"x","line_items":[]}' > /tmp/bad.json
          if ./workagent run --case bid_quote --input /tmp/bad.json . --replay ; then
            echo "越界输入未被拒绝，边界失效"; exit 1
          else
            echo "越界输入已正确拒绝"
          fi

      - name: 全包摘要
        run: ./workagent seal .
