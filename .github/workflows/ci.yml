name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21", "1.22"]
        exclude:
          - os: macos-latest
            go: "1.21"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: go vet ./...

      - name: gofmt 检查（提示性；gofmt 输出随工具链版本变化，不作为阻塞条件）
        if: runner.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未经 gofmt 格式化："
            echo "$unformatted"
            gofmt -d ./cmd ./internal || true
          fi

      - name: 构建（静态二进制，与 make release 保持一致）
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o workagent ./cmd/workagent

      - name: 列出模型服务商（无需密钥）
        run: ./workagent models

      - name: 包结构校验
        run: ./workagent check .

      - name: 计算闭包摘要
        run: ./workagent attest .

      - name: 生成适配层
        run: ./workagent adapt .

      - name: 路径 A — 结构化输入，纯确定性（L3，不联网、不调模型）
        run: ./workagent run --input examples/bid_quote/input.json .

      - name: 路径 A 复现校验（必须 PASS）
        run: ./workagent verify .

      - name: 路径 B — 自然语言输入，模型抽取（重放录制响应，无需联网与密钥）
        run: ./workagent run --input examples/bid_quote/input.natural.json . --replay

      - name: 路径 B 复现校验（必须 PASS）
        run: ./workagent verify .

      - name: 边界拒绝测试（越界输入必须失败）
        shell: bash
        run: |
          echo '{"project":"x","line_items":[]}' > /tmp/bad.json
          if ./workagent run --input /tmp/bad.json . --replay ; then
            echo "越界输入未被拒绝，边界失效"; exit 1
          else
            echo "越界输入已正确拒绝"
          fi

      - name: 全包摘要
        run: ./workagent seal .
