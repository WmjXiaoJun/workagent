name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21", "1.22"]
        exclude:
          - os: macos-latest
            go: "1.21"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: go vet ./...

      - name: gofmt 检查
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l ./cmd)"

      - name: 构建
        run: go build -o workagent ./cmd/workagent

      - name: 包结构校验
        run: ./workagent check .

      - name: 计算闭包摘要
        run: ./workagent attest .

      - name: 生成适配层
        run: ./workagent adapt .

      - name: 执行并产出证据包
        run: ./workagent run --input examples/bid_quote/input.json .

      - name: 复现校验（必须 PASS）
        run: ./workagent verify .

      - name: 边界拒绝测试（越界输入必须失败）
        shell: bash
        run: |
          echo '{"project":"x","line_items":[]}' > /tmp/bad.json
          if ./workagent run --input /tmp/bad.json . ; then
            echo "越界输入未被拒绝，边界失效"; exit 1
          else
            echo "越界输入已正确拒绝"
          fi

      - name: 全包摘要
        run: ./workagent seal .
