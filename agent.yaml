# ============================================================================
# WorkAgent Package Manifest —— 唯一真源 (Single Source of Truth)
# ============================================================================
# 兼容策略：APS 基础字段结构保持不变；所有自定义能力置于 x-workagent 扩展区。
# 旧平台读到 x-workagent 会忽略它，本包仍可运行（能力降级，见 compat.json）。
# 新增能力只加目录、不改字段。
# ----------------------------------------------------------------------------

aps_version: "0.2"
spec_version: "0.6.0"

id: "io.github.wmjxiaojun/workagent"
name: "workagent"
display_name: "WorkAgent"
display_name_en: "WorkAgent"
version: "0.6.0"
license: "MIT"
summary: "别人交付对话，我们交付可复现的结论。"
summary_en: "Others ship conversations. We ship reproducible conclusions."

author:
  name: "xiaojun"
  contact: "261235953@qq.com"
  responsibility: "对规则、假设、数据源与逻辑框架负责"

inputs: "inputs.schema.json"
outputs: "artifacts/output_schema.json"

execution:
  workflow: "execution/workflow.yml"
  runtime: "execution/runtime.dockerfile"
  default_case: "bid_quote"

  # 兼容保留：未声明 cases 的旧包用这两个字段
  executor:
    command: ["python", "examples/bid_quote/executor.py"]
    deterministic: true
    requires_network: false
  llm_steps: []

  # --------------------------------------------------------------------------
  # 多场景：一个包承载多个可验证业务场景，共用同一套基础设施
  #   shape: 测算型 / 核验型 / 抽取型 / 排程型 / 推演型
  #   LLM 步骤一律「模型只抽取，判断交给代码」，抽取结果会被录制以便离线重放
  # --------------------------------------------------------------------------
  cases:
    - id: "bid_quote"
      title: "投标报价测算"
      industry: "建筑工程"
      shape: "测算型"
      executor: ["python", "examples/bid_quote/executor.py"]
      boundary: "examples/bid_quote/boundary.json"
      sample_input: "examples/bid_quote/input.json"
      sample_natural: "examples/bid_quote/input.natural.json"
      llm_steps:
        - id: "extract"
          provider: "ollama"
          model: "qwen2.5:7b"
          prompt: "examples/bid_quote/extract.prompt.md"
          temperature: 0
          seed: 42
          json_mode: true
          when_input_has: "description"

    - id: "expense_audit"
      title: "报销单合规审核"
      industry: "财务"
      shape: "核验型"
      executor: ["python", "examples/expense_audit/executor.py"]
      boundary: "examples/expense_audit/boundary.json"
      sample_natural: "examples/expense_audit/input.natural.json"
      llm_steps:
        - id: "extract"
          provider: "ollama"
          model: "qwen2.5:7b"
          prompt: "examples/expense_audit/prompt.md"
          temperature: 0
          seed: 42
          json_mode: true
          when_input_has: "description"

    - id: "lab_report"
      title: "检验报告异常判定"
      industry: "医疗"
      shape: "核验型"
      executor: ["python", "examples/lab_report/executor.py"]
      boundary: "examples/lab_report/boundary.json"
      sample_natural: "examples/lab_report/input.natural.json"
      llm_steps:
        - id: "extract"
          provider: "ollama"
          model: "qwen2.5:7b"
          prompt: "examples/lab_report/prompt.md"
          temperature: 0
          seed: 42
          json_mode: true
          when_input_has: "description"

    - id: "point_table"
      title: "通信点表核对"
      industry: "工业自动化"
      shape: "核验型"
      executor: ["python", "examples/point_table/executor.py"]
      boundary: "examples/point_table/boundary.json"
      sample_natural: "examples/point_table/input.natural.json"
      llm_steps:
        - id: "extract"
          provider: "ollama"
          model: "qwen2.5:7b"
          prompt: "examples/point_table/prompt.md"
          temperature: 0
          seed: 42
          json_mode: true
          when_input_has: "description"

    - id: "spc_control"
      title: "SPC 控制图判异"
      industry: "制造业"
      shape: "核验型"
      executor: ["python", "examples/spc_control/executor.py"]
      boundary: "examples/spc_control/boundary.json"
      sample_input: "examples/spc_control/input.json"

    - id: "pin_conflict"
      title: "嵌入式资源冲突检测"
      industry: "嵌入式"
      shape: "核验型"
      executor: ["python", "examples/pin_conflict/executor.py"]
      boundary: "examples/pin_conflict/boundary.json"
      sample_input: "examples/pin_conflict/input.json"

    - id: "salary_tax"
      title: "工资薪金个税测算"
      industry: "人力资源"
      shape: "测算型"
      executor: ["python", "examples/salary_tax/executor.py"]
      boundary: "examples/salary_tax/boundary.json"
      sample_input: "examples/salary_tax/input.json"

    - id: "loan_dscr"
      title: "项目贷款偿债能力测算"
      industry: "金融"
      shape: "测算型"
      executor: ["python", "examples/loan_dscr/executor.py"]
      boundary: "examples/loan_dscr/boundary.json"
      sample_input: "examples/loan_dscr/input.json"

provenance:
  trace: "provenance/trace.json"
  data_sources: "provenance/data_sources.json"
  assumptions: "provenance/assumptions.json"

attest:
  closure: "attest/closure.json"

signature:
  path: "signature/agent.sig"

x-workagent:
  namespace: "x-workagent"
  version: "0.6.0"
  compat: "compat.json"
  boundary: "x-workagent/boundary.json"
  test_suite: "x-workagent/test_suite"
  adapters: "adapters"
