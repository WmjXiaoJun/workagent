# ============================================================================
# WorkAgent Package Manifest —— 唯一真源 (Single Source of Truth)
# ============================================================================
# 兼容策略：APS 基础字段结构保持不变；所有自定义能力置于 x-workagent 扩展区。
# 旧平台读到 x-workagent 会忽略它，本包仍可运行（能力降级，见 compat.json）。
# 新增能力只加目录、不改字段。
# ----------------------------------------------------------------------------

aps_version: "0.2"
spec_version: "0.3.0"

id: "io.github.wmjxiaojun/workagent"
name: "workagent"
display_name: "WorkAgent"
display_name_en: "WorkAgent"
version: "0.3.0"
license: "MIT"
summary: "别人交付对话，我们交付可复现的结论。"
summary_en: "Others ship conversations. We ship reproducible conclusions."

author:
  name: "xiaojun"
  contact: "261235953@qq.com"
  responsibility: "对规则、假设、数据源与逻辑框架负责"

inputs: "inputs.schema.json"
outputs: "artifacts/output_schema.json"

execution:
  workflow: "execution/workflow.yml"
  runtime: "execution/runtime.dockerfile"
  executor:
    # 确定性执行体：读 argv[1]（可能是富化后的输入），向 stdout 输出 {"output": {...}}
    command: ["python", "examples/bid_quote/executor.py"]
    deterministic: true
    requires_network: false

  # LLM 步骤（可选）—— 模型只做「抽取」，判断与计算全部交给上面的确定性执行体。
  # 抽取结果不可复现，因此会被录制到 provenance/llm/；verify 默认重放录制而非重放模型。
  # when_input_has 为真时该步骤才执行：结构化输入会直接跳过，无需联网。
  llm_steps:
    - id: "extract"
      provider: "ollama"          # 本地开源权重，可离线、可做到端到端复现
      model: "qwen2.5:7b"
      prompt: "examples/bid_quote/extract.prompt.md"
      temperature: 0
      seed: 42
      json_mode: true
      when_input_has: "description"

provenance:
  trace: "provenance/trace.json"
  data_sources: "provenance/data_sources.json"
  assumptions: "provenance/assumptions.json"

attest:
  closure: "attest/closure.json"

signature:
  path: "signature/agent.sig"

x-workagent:
  namespace: "x-workagent"
  version: "0.3.0"
  compat: "compat.json"
  boundary: "x-workagent/boundary.json"
  test_suite: "x-workagent/test_suite"
  adapters: "adapters"
