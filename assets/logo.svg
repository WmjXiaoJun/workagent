<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="WorkAgent">
  <title>WorkAgent</title>
  <desc>证据链 + 验证勾：别人交付对话，我们交付可复现的结论。</desc>
  <defs>
    <linearGradient id="wa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F5BFF"/>
      <stop offset="58%" stop-color="#6A4BFF"/>
      <stop offset="100%" stop-color="#00C2A8"/>
    </linearGradient>
    <linearGradient id="wa-fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.86"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#wa-bg)"/>

  <!-- 证据链：三个节点串成一条可追溯的路径 -->
  <g fill="none" stroke="url(#wa-fg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 82 L52 50 L70 82"/>
  </g>
  <g fill="url(#wa-fg)">
    <circle cx="34" cy="82" r="7.5"/>
    <circle cx="52" cy="50" r="7.5"/>
    <circle cx="70" cy="82" r="7.5"/>
  </g>

  <!-- 验证勾：结论已被验证 -->
  <circle cx="94" cy="72" r="19" fill="#0B1020" opacity="0.16"/>
  <circle cx="94" cy="72" r="17" fill="#FFFFFF" opacity="0.97"/>
  <path d="M86 72 l6 7 l11 -14" fill="none" stroke="#2F5BFF" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
